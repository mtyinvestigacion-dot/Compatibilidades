{% extends "base.html" %}
{% block title %}Nuevo usuario - Sistema de Compatibilidades{% endblock %}
{% block page_title %}Nuevo usuario{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header"><i class="bi bi-person-plus"></i> Nuevo usuario</div>
            <div class="card-body">
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label">Usuario</label>
                        <input type="text" class="form-control" name="username" required
                               value="{{ (form.get('username', '') if form else '') }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Rol</label>
                        <select class="form-select" name="rol">
                            <option value="viewer" {% if not form or form.get('rol') == 'viewer' %}selected{% endif %}>
                                Viewer (solo consulta)
                            </option>
                            <option value="admin" {% if form and form.get('rol') == 'admin' %}selected{% endif %}>
                                Admin (puede editar)
                            </option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" class="form-control" name="password" required minlength="6">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Confirmar contraseña</label>
                        <input type="password" class="form-control" name="password_confirm" required minlength="6">
                    </div>
                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle"></i> Crear usuario
                        </button>
                        <a href="{{ url_for('main.listar_usuarios') }}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
